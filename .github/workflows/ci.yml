name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext libglib2.0-bin zip
      - name: Static checks
        run: ./scripts/check.sh
      - name: Pack extension
        run: ./scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ledge-extension
          path: dist/*.zip
