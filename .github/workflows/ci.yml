name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext libglib2.0-bin zip
      - name: Static checks
        run: ./scripts/check.sh
      - name: Pack extension
        run: ./scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ledge-extension
          path: dist/*.zip

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Shell 46
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner's Azure mirror has been crawling; use the main archive,
          # and time out and retry anything that stalls.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list || true
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            gnome-shell gnome-shell-extension-prefs dbus dbus-user-session \
            python3-gi gir1.2-glib-2.0 gettext libglib2.0-bin \
            mesa-utils libgl1-mesa-dri evolution-data-server
      - name: UI tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          ./tests/ui/run.sh
      - name: Upload GNOME Shell log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell-log
          path: ${{ runner.temp }}/xdg/ledge-nested/shell.log
